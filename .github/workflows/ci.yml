name: CI

on:
  pull_request:

# One run per PR head branch; a new push cancels the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

# Least privilege by default; jobs below only widen this where they must.
permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the PR base SHA is available for diffing.
          fetch-depth: 0

      - name: Branch name follows convention
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|chore|docs|refactor)/([A-Z]+-[0-9]+-)?[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$HEAD_REF" =~ $pattern ]]; then
            echo "::error::Branch '$HEAD_REF' does not match <type>/<STORY-ID>-<short-description> ($pattern)"
            exit 1
          fi
          if [[ "$HEAD_REF" =~ -v[0-9]+$ ]]; then
            echo "::error::Branch '$HEAD_REF' must not end in -v<number>; keep the same branch name instead"
            exit 1
          fi
          echo "Branch name OK: $HEAD_REF"

      - name: No .env* file is added
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA")
          offenders=$(printf '%s\n' "$added" | grep -E '(^|/)\.env[^/]*$' || true)
          if [ -n "$offenders" ]; then
            while IFS= read -r file; do
              echo "::error file=$file::.env* files must never be committed"
            done <<< "$offenders"
            exit 1
          fi
          echo "No .env* files added."

      - name: Warn when the diff is large
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          total=$(gh pr view "$PR_NUMBER" --json additions,deletions --jq '.additions + .deletions')
          echo "Diff size: $total changed lines"
          if [ "$total" -gt 400 ]; then
            echo "::warning::This PR touches $total lines (>400). Consider splitting it into smaller PRs."
          fi

  web:
    name: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # web/ installs with npm and commits a package-lock.json.
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  ai-service:
    name: ai-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        # ruff only. The service's runtime deps (torch/transformers) are far too heavy
        # to install in CI and are not needed to lint or syntax-check the source.
        run: pip install --disable-pip-version-check ruff

      # Non-blocking on purpose. `ruff check` already fails on main with three findings
      # in app code, not in this workflow: I001 (import order) and B008 (function call in
      # argument default) in main.py, and EXE001 (shebang on a non-executable file) in
      # seed_item.py. Failing the job for those would block every PR on pre-existing debt,
      # so the step is allowed to fail and the findings are surfaced as a warning instead.
      # Fix the app code, then delete `continue-on-error` and the warning step to make
      # this enforcing. Note this is deliberately a step-level guard: a failing job would
      # still report a FAILURE check run, which would block merging once this check is
      # required on main.
      - name: ruff check
        id: ruff
        continue-on-error: true
        run: ruff check .

      - name: Report non-blocking ruff findings
        if: steps.ruff.outcome == 'failure'
        run: |
          echo "::warning::ruff check found pre-existing issues in ai-service app code (I001, B008 in main.py; EXE001 in seed_item.py). This step is non-blocking until that debt is fixed."

      - name: Byte-compile sources
        run: python -m compileall -q .

  schema:
    name: schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate changed schema files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Everything under supabase/migrations as that directory grows, plus the
          # standalone schema file the ai-service keeps its own copy of.
          mapfile -t files < <(
            git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA" \
              -- supabase/migrations ai-service/supabase/schema.sql \
              | grep -E '\.sql$' || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No schema .sql files added or modified in this PR."
            exit 0
          fi

          fail=0
          for file in "${files[@]}"; do
            echo "Checking $file"

            # Findings are reported per table and per function header rather than per
            # file. A monolithic schema file (ai-service/supabase/schema.sql is ~750
            # lines) almost always contains at least one ENABLE ROW LEVEL SECURITY and
            # one search_path somewhere, so a whole-file "does it contain X?" test would
            # pass no matter what else in the file is broken. SQL comments are stripped
            # first, so prose that merely mentions SECURITY DEFINER can neither raise a
            # finding nor mask a real one; line numbers are preserved for annotations.
            findings=$(awk '
              function bare(t,   s) {
                s = t
                sub(/^.*[[:space:]]/, "", s)
                gsub(/"/, "", s)
                sub(/^[a-z0-9_]+[.]/, "", s)
                return s
              }
              function check_definer() {
                if (hdr ~ /security[[:space:]]+definer/ && hdr !~ /search_path/) {
                  printf "%d\tSECURITY DEFINER without a SET search_path clause\n", start
                }
              }
              {
                line = ""; i = 1
                while (i <= length($0)) {
                  if (inblk) {
                    if (substr($0, i, 2) == "*/") { inblk = 0; i += 2 } else { i++ }
                    continue
                  }
                  if (substr($0, i, 2) == "/*") { inblk = 1; i += 2; continue }
                  if (substr($0, i, 2) == "--") break
                  line = line substr($0, i, 1); i++
                }
                l = tolower(line)

                if (match(l, /create[[:space:]]+table[[:space:]]+(if[[:space:]]+not[[:space:]]+exists[[:space:]]+)?[a-z0-9_".]+/)) {
                  created[bare(substr(l, RSTART, RLENGTH))] = NR
                }

                if (l ~ /alter[[:space:]]+table/) { alt = l } else if (alt != "") { alt = alt " " l }
                if (alt != "") {
                  if (match(alt, /alter[[:space:]]+table[[:space:]]+[a-z0-9_".]+[[:space:]]+enable[[:space:]]+row[[:space:]]+level[[:space:]]+security/)) {
                    s = substr(alt, RSTART, RLENGTH)
                    sub(/[[:space:]]+enable.*$/, "", s)
                    rls[bare(s)] = 1
                    alt = ""
                  } else if (l ~ /;/) { alt = "" }
                }

                if (l ~ /create[[:space:]]+(or[[:space:]]+replace[[:space:]]+)?function/) {
                  if (hdr != "") check_definer()
                  hdr = l; start = NR
                  if (l ~ /[$][a-z_]*[$]/) { check_definer(); hdr = "" }
                  next
                }
                if (hdr != "") {
                  hdr = hdr " " l
                  if (l ~ /[$][a-z_]*[$]/) { check_definer(); hdr = "" }
                }
              }
              END {
                if (hdr != "") check_definer()
                for (t in created) {
                  if (!(t in rls)) {
                    printf "%d\tCREATE TABLE without a matching ENABLE ROW LEVEL SECURITY\n", created[t]
                  }
                }
              }
            ' "$file" | sort -n)

            if [ -n "$findings" ]; then
              while IFS=$'\t' read -r lineno message; do
                if [ -n "$lineno" ]; then
                  echo "::error file=$file,line=$lineno::$message"
                fi
              done <<< "$findings"
              fail=1
            fi
          done
          exit "$fail"
